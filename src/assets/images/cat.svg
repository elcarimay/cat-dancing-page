<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- Body -->
  <ellipse cx="100" cy="150" rx="55" ry="50" fill="#F4A460"/>
  <!-- Head -->
  <circle cx="100" cy="85" r="45" fill="#F4A460"/>
  <!-- Left ear -->
  <polygon points="60,50 45,15 80,42" fill="#F4A460"/>
  <polygon points="63,47 52,22 76,43" fill="#FFB6C1"/>
  <!-- Right ear -->
  <polygon points="140,50 155,15 120,42" fill="#F4A460"/>
  <polygon points="137,47 148,22 124,43" fill="#FFB6C1"/>
  <!-- Eyes -->
  <ellipse cx="82" cy="80" rx="10" ry="11" fill="white"/>
  <ellipse cx="118" cy="80" rx="10" ry="11" fill="white"/>
  <circle cx="84" cy="81" r="6" fill="#333"/>
  <circle cx="120" cy="81" r="6" fill="#333"/>
  <circle cx="86" cy="79" r="2" fill="white"/>
  <circle cx="122" cy="79" r="2" fill="white"/>
  <!-- Nose -->
  <polygon points="100,95 96,100 104,100" fill="#FF69B4"/>
  <!-- Mouth -->
  <path d="M96,100 Q92,106 88,104" stroke="#333" stroke-width="1.5" fill="none"/>
  <path d="M104,100 Q108,106 112,104" stroke="#333" stroke-width="1.5" fill="none"/>
  <!-- Whiskers left -->
  <line x1="55" y1="95" x2="90" y2="98" stroke="#888" stroke-width="1.2"/>
  <line x1="52" y1="101" x2="90" y2="101" stroke="#888" stroke-width="1.2"/>
  <line x1="55" y1="107" x2="90" y2="104" stroke="#888" stroke-width="1.2"/>
  <!-- Whiskers right -->
  <line x1="145" y1="95" x2="110" y2="98" stroke="#888" stroke-width="1.2"/>
  <line x1="148" y1="101" x2="110" y2="101" stroke="#888" stroke-width="1.2"/>
  <line x1="145" y1="107" x2="110" y2="104" stroke="#888" stroke-width="1.2"/>
  <!-- Belly -->
  <ellipse cx="100" cy="158" rx="30" ry="28" fill="#FFDAB9"/>
  <!-- Left arm -->
  <ellipse cx="52" cy="155" rx="14" ry="22" fill="#F4A460" transform="rotate(-20, 52, 155)"/>
  <!-- Right arm -->
  <ellipse cx="148" cy="155" rx="14" ry="22" fill="#F4A460" transform="rotate(20, 148, 155)"/>
  <!-- Left leg -->
  <ellipse cx="75" cy="197" rx="16" ry="12" fill="#F4A460"/>
  <!-- Right leg -->
  <ellipse cx="125" cy="197" rx="16" ry="12" fill="#F4A460"/>
  <!-- Tail -->
  <path d="M155,160 Q185,140 175,110 Q165,85 180,75" stroke="#F4A460" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- Tail tip -->
  <circle cx="180" cy="74" r="8" fill="#D2691E"/>
</svg>
